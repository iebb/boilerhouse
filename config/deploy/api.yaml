apiVersion: apps/v1
kind: Deployment
metadata:
  name: boilerhouse-api
  namespace: boilerhouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: boilerhouse-api
  template:
    metadata:
      labels:
        app: boilerhouse-api
    spec:
      serviceAccountName: boilerhouse-operator
      containers:
        - name: api
          image: boilerhouse-api:latest
          env:
            - name: K8S_NAMESPACE
              value: boilerhouse
            # Bind 0.0.0.0 so the Service + kubelet can reach it (the api defaults
            # to 127.0.0.1). The API serves everything — including /api/v1/health —
            # on :3000; there is no separate :8081 health server (that's the operator).
            - name: LISTEN_HOST
              value: 0.0.0.0
          ports:
            - containerPort: 3000
              name: http
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: boilerhouse-api
  namespace: boilerhouse
spec:
  selector:
    app: boilerhouse-api
  ports:
    - name: http
      port: 3000
      targetPort: http
